; PlatformIO project for the M5Stack Unit-C6L (ESP32-C6 + SX1262).
;
; If PlatformIO complains it doesn't recognize the board id below, run
; `pio boards espressif32 | grep -i c6` to see what your installed platform
; version calls it (naming has shifted between platform-espressif32
; releases) and swap it in here.

[platformio]
default_envs = hello_world

[env]
; The official PlatformIO espressif32 platform doesn't declare Arduino
; framework support for the ESP32-C6 (open upstream issue, unresolved for
; a long time), so this points at the pioarduino fork instead, which does.
; Same board id, same everything else.
;
; Tracking `develop` rather than a pinned release: the `stable` tag was shipping an esptool that
; crashed every upload (pioarduino/platform-espressif32#539, fixed upstream in `develop`), and `develop` is
; also what M5Stack's own Unit C6L reference config uses. It is a moving target - if uploads ever break
; again, context.md ("Flashing") explains how to recognise the bug, pin the platform to a known-good
; commit, and flash with a separately installed esptool.
platform = https://github.com/pioarduino/platform-espressif32/archive/refs/heads/develop.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
; Corrected from an initial 16MB assumption: the ROM bootloader's own
; runtime partition-table check ("flash chip size 0x800000") confirmed the
; real chip is 8MB. The 16MB partition table had an OTA slot ending past
; that boundary, so the bootloader rejected it outright and the board
; boot-looped forever. If default_8MB.csv isn't found in your framework
; version, default_4MB.csv (matching M5Stack's own Arduino board-manager
; default for this board) is the safe fallback - our firmware is ~470KB,
; nowhere near tight on either.
lib_deps =
    m5stack/M5Unified @ ^0.2.11
    adafruit/Adafruit NeoPixel @ ^1.15.1
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.13
    jgromes/RadioLib @ ^7.3.0
; common/ (lora_radio) is shared by every role.
; It has to be on the include path explicitly - a #include "foo.h" only
; searches the including file's own directory by default, and PlatformIO
; doesn't auto-add every src/ subfolder, only include/.
build_flags =
    -I src/common
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    -D CORE_DEBUG_LEVEL=1
; CORE_DEBUG_LEVEL=1 (errors only) for now - Verbose (5) was flooding the
; console with a periodic I2C poll unrelated to anything we're testing
; (likely a touch/power-gauge check that doesn't apply to this board),
; making the hello_world CLI unusable. Bump back to 5 temporarily when
; resuming the SX1262/periman-level debugging.
build_src_filter = +<common/>

[env:hello_world]
build_src_filter = ${env.build_src_filter} +<roles/hello_world/>
build_flags = ${env.build_flags} -D FIRMWARE_ROLE=\"hello_world\"

[env:lora_node]
build_src_filter = ${env.build_src_filter} +<roles/lora_node/>
build_flags = ${env.build_flags} -D FIRMWARE_ROLE=\"lora_node\"

[env:sc_gateway]
build_src_filter = ${env.build_src_filter} +<roles/sc_gateway/>
build_flags = ${env.build_flags} -D FIRMWARE_ROLE=\"sc_gateway\"