<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>c6l-hub flash console</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  .role { border: 1px solid #ccc; border-radius: 8px; padding: 12px 16px;
          margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .role.missing { opacity: 0.5; }
  button { padding: 8px 14px; border-radius: 6px; border: none; background: #2563eb; color: white; cursor: pointer; }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  pre { background: #111; color: #0f0; padding: 12px; border-radius: 6px;
        max-height: 320px; overflow: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Unit-C6L flash console</h1>
<p>Serial port: <code>{{ port }}</code> (set <code>C6L_PORT</code> to change it)</p>

{% for role in roles %}
<div class="role {{ '' if role.ready else 'missing' }}">
  <div>
    <strong>{{ role.name }}</strong><br>
    <small>{{ role.bin if role.bin else 'no .bin in firmware_bins/' + role.name + '/' }}</small>
  </div>
  <button onclick="flashRole('{{ role.name }}')" {{ 'disabled' if not role.ready else '' }}>Flash</button>
</div>
{% else %}
<p>No role folders found under <code>firmware_bins/</code>.</p>
{% endfor %}

<pre id="out">Ready.</pre>

<script>
async function flashRole(role) {
  const out = document.getElementById('out');
  out.textContent = `Flashing ${role} ...`;
  try {
    const res = await fetch(`/api/flash/${role}`, { method: 'POST' });
    const data = await res.json();
    out.textContent = (data.ok ? 'OK\n' : 'FAILED\n')
      + (data.stdout || '') + '\n' + (data.stderr || data.error || '');
  } catch (e) {
    out.textContent = 'Request failed: ' + e;
  }
}
</script>
</body>
</html>
